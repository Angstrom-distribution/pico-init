name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install meson and ninja
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build
      - name: Configure
        run: meson setup build
      - name: Build
        run: ninja -C build
      # Root: the PID1 core tests write real cgroups and the netd ones create
      # veth pairs and bind :123. Unprivileged they fail rather than skip.
      # -E keeps the caller's environment.
      - name: Test
        run: sudo -E meson test -C build --print-errorlogs

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        # Pinned: an unpinned clang-format silently changes formatting rules
        # when the runner image bumps its default, turning CI red with no
        # code change.
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src -name '*.c' -o -name '*.h' | xargs -r clang-format-18 --dry-run --Werror

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: REUSE license compliance
        uses: fsfe/reuse-action@v5
