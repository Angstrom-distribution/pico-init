version = 1

[[annotations]]
path = [
  "README.md",
  "NEWS",
  "docs/**",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "LICENSE",
  "LICENSES/**",
  ".github/**",
  ".gitignore",
]
SPDX-FileCopyrightText = "Koen Kooi"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Verbatim copies from systemd v262: the libsystemd.sym and libudev.sym that
# tools/gen-libsystemd-sym.py reads to produce the compat libraries' version
# scripts, and the pkg-config templates the test-*-pc tests diff the
# generated .pc files against.
[[annotations]]
path = [
  "src/compat/libsystemd/libsystemd-v262.sym",
  "src/compat/libsystemd/libsystemd-v262.pc.in",
  "src/compat/libsystemd/systemd-v262.pc.in",
  "src/compat/libudev/libudev-v262.sym",
  "src/compat/libudev/libudev-v262.pc.in",
  "src/compat/libudev/udev-v262.pc.in",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "systemd contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
