version = 1

[[annotations]]
path = [
  "README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "LICENSE",
  "LICENSES/**",
  ".github/**",
  ".gitignore",
]
SPDX-FileCopyrightText = "Koen Kooi"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Verbatim copies from systemd at the pinned tag: src/libsystemd/
# libsystemd.sym, which the generator (tools/gen-libsystemd-sym.py) reads
# to produce libsystemd.sym as a subset plus one pico-only node, and the
# two pkg-config templates test-systemd-pc diffs the installed .pc files
# against.
[[annotations]]
path = [
  "src/compat/libsystemd/libsystemd-v259.sym",
  "src/compat/libsystemd/libsystemd-v259.pc.in",
  "src/compat/libsystemd/systemd-v259.pc.in",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "systemd contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
